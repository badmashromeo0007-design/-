<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTTH Cinematic Script Generator</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        h2 {
            color: #ff5252;
            text-align: center;
            margin-bottom: 20px;
        }
        label {
            font-weight: bold;
            color: #ff8a80;
            display: block;
            margin-bottom: 8px;
        }
        textarea {
            width: 100%;
            height: 120px;
            background: #2c2c2c;
            color: #fff;
            border: 1px solid #444;
            border-radius: 5px;
            padding: 10px;
            font-size: 14px;
            resize: vertical;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            background: #ff5252;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.3s;
        }
        button:hover {
            background: #ff1744;
        }
        .output-section {
            margin-top: 25px;
        }
        pre {
            background: #2c2c2c;
            padding: 15px;
            border-radius: 5px;
            white-space: pre-wrap;
            word-wrap: break-word;
            color: #b9f6ca;
            border: 1px solid #444;
            max-height: 400px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Audio & Video Script Generator</h2>
        <form method="POST">
            <label for="story_input">Apni Story / Scene Details Yahan Likhein:</label>
            <textarea id="story_input" name="story_input" placeholder="Yahan apni story, characters, fight scenes, aur unki powers seedhe likh dein..." required>{{ request.form.get('story_input', '') }}</textarea>
            <button type="submit">Generate Script</button>
        </form>

        {% if generated_script %}
        <div class="output-section">
            <label>Generated Cinematic Script:</label>
            <pre>{{ generated_script }}</pre>
        </div>
        {% endif %}
    </div>
</body>
</html>
