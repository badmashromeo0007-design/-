<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Cinematic Audio Drama Studio - BTTH x Super Yoddha</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #08080c; color: #f3f4f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .red-glow { border: 1px solid rgba(220, 38, 38, 0.4); box-shadow: 0 0 30px rgba(220, 38, 38, 0.15); }
        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #0f0f15; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #ef4444; }
    </style>
</head>
<body class="min-h-screen py-8 px-4 custom-scrollbar">
    <div class="max-w-5xl mx-auto">
        <!-- Header -->
        <header class="text-center mb-8">
            <h1 class="text-2xl md:text-4xl font-black text-red-600 tracking-wider">CINEMATIC 3D AUDIO DRAMA & STUDIO</h1>
            <p class="text-gray-400 text-xs md:text-sm mt-2">Battle Through The Heavens × Super Yoddha Fusion Generator</p>
        </header>

        <!-- Control Panel -->
        <div class="red-glow bg-gray-900/90 rounded-2xl p-6 md:p-8 backdrop-blur-md mb-8">
            <div class="mb-5">
                <label class="block text-sm font-bold text-amber-400 mb-2">Episode Concept / Next Storyline *</label>
                <textarea id="story_summary" rows="4" class="w-full bg-black/80 border border-gray-700 rounded-xl p-3.5 text-white focus:outline-none focus:border-red-500 text-sm" placeholder="Example: Dhruv jungle mein akela hai, achanak system alert aata hai ki ek khatarnak shakti kareeb aa rahi hai..."></textarea>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
                <div>
                    <label class="block text-xs font-semibold text-gray-300 mb-1.5">Chapter No.</label>
                    <input type="number" id="chapter_number" value="2" class="w-full bg-black/80 border border-gray-700 rounded-lg p-3 text-white text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-300 mb-1.5">Chapter Title</label>
                    <input type="text" id="chapter_title" value="Episode 2: System Awakening" class="w-full bg-black/80 border border-gray-700 rounded-lg p-3 text-white text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-300 mb-1.5">Unique System Name</label>
                    <input type="text" id="system_name" value="DIVINE SOUL SYSTEM" class="w-full bg-black/80 border border-gray-700 rounded-lg p-3 text-white text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-300 mb-1.5">Dhruv Current Rank</label>
                    <select id="dhruv_rank" class="w-full bg-black/80 border border-gray-700 rounded-lg p-3 text-white text-sm">
                        <option value="3rd Star (Shunya Rank)">3rd Star (Shunya Rank)</option>
                        <option value="5th Star (Awakening Stage)">5th Star (Awakening Stage)</option>
                        <option value="Dou Zhe Stage (Initial Warrior)">Dou Zhe Stage (Initial Warrior)</option>
                        <option value="Dou Shi Stage (Master Level)">Dou Shi Stage (Master Level)</option>
                    </select>
                </div>
            </div>

            <button onclick="generateScript()" id="genBtn" class="w-full bg-red-600 hover:bg-red-700 text-white font-extrabold py-3.5 px-6 rounded-xl transition tracking-wide shadow-lg shadow-red-950/80 text-sm md:text-base">
                GENERATE SCRIPT WITH UNIQUE SYSTEM 🎬✨
            </button>
        </div>

        <!-- AI Voiceover Studio (Edge TTS) -->
        <div class="red-glow bg-gray-900/90 rounded-2xl p-6 backdrop-blur-md mb-8">
            <h2 class="text-lg font-bold text-amber-400 mb-3">AI Voiceover Generator (Free Edge TTS)</h2>
            <div class="space-y-3">
                <textarea id="voice_text_input" rows="3" placeholder="Yahan script ka dialogue ya voiceover text paste karein (Hindi/Hinglish)..." class="w-full bg-black/80 border border-gray-700 rounded-lg p-3 text-white text-xs md:text-sm"></textarea>
                <div class="flex flex-col md:flex-row gap-3 items-center">
                    <select id="voice_type" class="w-full md:w-1/3 bg-black/80 border border-gray-700 rounded-lg p-3 text-white text-xs md:text-sm">
                        <option value="hi-IN-MadhurNeural">Madhur (Deep Male Voice)</option>
                        <option value="hi-IN-SwaraNeural">Swara (Female Voice)</option>
                    </select>
                    <button onclick="generateAudio()" id="audBtn" class="w-full md:w-2/3 bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-6 rounded-lg text-xs md:text-sm transition">
                        Generate Voiceover MP3 🎙️
                    </button>
                </div>
            </div>
            <div id="audioContainer" class="mt-4 hidden text-center">
                <p class="text-xs text-green-400 mb-2">Voiceover MP3 Ready!</p>
                <audio id="renderedAudio" controls class="w-full max-w-xl mx-auto rounded-xl border border-red-500 shadow-xl"></audio>
            </div>
        </div>

        <!-- AI Video Rendering Studio -->
        <div class="red-glow bg-gray-900/90 rounded-2xl p-6 backdrop-blur-md mb-8">
            <h2 class="text-lg font-bold text-amber-400 mb-3">AI 3D Video Render Generator</h2>
            <div class="flex flex-col md:flex-row gap-3">
                <input type="text" id="video_prompt_input" placeholder="Paste 3D Animation Video Prompt here..." class="flex-1 bg-black/80 border border-gray-700 rounded-lg p-3 text-white text-xs md:text-sm">
                <button onclick="generateVideo()" id="vidBtn" class="bg-amber-600 hover:bg-amber-700 text-white font-bold py-3 px-6 rounded-lg text-xs md:text-sm transition">
                    Render 3D Clip 🎥
                </button>
            </div>
            <div id="videoContainer" class="mt-4 hidden text-center">
                <p class="text-xs text-green-400 mb-2">3D Video Render Complete!</p>
                <video id="renderedVideo" controls class="w-full max-w-xl mx-auto rounded-xl border border-red-500 shadow-xl"></video>
            </div>
        </div>

        <!-- Output Section -->
        <div id="outputSection" class="hidden red-glow bg-gray-900/90 rounded-2xl p-6 md:p-8 backdrop-blur-md">
            <div class="flex justify-between items-center mb-4 border-b border-gray-800 pb-3">
                <h2 class="text-lg md:text-xl font-bold text-amber-400">Cinematic Script & System Logs</h2>
                <button onclick="copyOutput()" class="bg-gray-800 hover:bg-gray-700 text-gray-300 text-xs px-3 py-1.5 rounded border border-gray-600">Copy Script 📋</button>
            </div>
            <div id="resultContent" class="pl-4 border-l-4 border-red-500 whitespace-pre-wrap text-gray-200 leading-relaxed font-mono text-xs md:text-sm"></div>
        </div>
    </div>

    <script>
        async function generateScript() {
            const story_summary = document.getElementById('story_summary').value;
            const chapter_number = document.getElementById('chapter_number').value;
            const chapter_title = document.getElementById('chapter_title').value;
            const system_name = document.getElementById('system_name').value;
            const dhruv_rank = document.getElementById('dhruv_rank').value;
            const num_scenes = document.getElementById('num_scenes').value;
            const btn = document.getElementById('genBtn');
            const outputSection = document.getElementById('outputSection');
            const resultContent = document.getElementById('resultContent');

            if (!story_summary.trim()) {
                alert('Kripya episode ka concept ya summary daalein!');
                return;
            }

            btn.disabled = true;
            btn.innerText = 'Creating Script with Unique System Logs...';
            outputSection.classList.add('hidden');

            try {
                const response = await fetch('/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ story_summary, chapter_number, chapter_title, system_name, dhruv_rank, num_scenes })
                });

                const data = await response.json();
                if (data.success) {
                    resultContent.innerText = data.result;
                    outputSection.classList.remove('hidden');
                } else {
                    alert('Error: ' + data.error);
                }
            } catch (err) {
                alert('Connection Error!');
                console.error(err);
            } finally {
                btn.disabled = false;
                btn.innerText = 'GENERATE SCRIPT WITH UNIQUE SYSTEM 🎬✨';
            }
        }

        async function generateAudio() {
            const text = document.getElementById('voice_text_input').value;
            const voice_type = document.getElementById('voice_type').value;
            const btn = document.getElementById('audBtn');
            const container = document.getElementById('audioContainer');
            const audioElem = document.getElementById('renderedAudio');

            if (!text.trim()) {
                alert('Kripya voiceover ke liye text daalein!');
                return;
            }

            btn.disabled = true;
            btn.innerText = 'Generating Voiceover MP3...';

            try {
                const response = await fetch('/generate-audio', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text, voice_type })
                });

                const data = await response.json();
                if (data.success && data.audio_url) {
                    audioElem.src = data.audio_url;
                    container.classList.remove('hidden');
                    audioElem.play();
                } else {
                    alert('Audio Error: ' + (data.error || 'Failed'));
                }
            } catch (err) {
                alert('Audio Generation Failed!');
            } finally {
                btn.disabled = false;
                btn.innerText = 'Generate Voiceover MP3 🎙️';
            }
        }

        async function generateVideo() {
            const prompt = document.getElementById('video_prompt_input').value;
            const btn = document.getElementById('vidBtn');
            const container = document.getElementById('videoContainer');
            const videoElem = document.getElementById('renderedVideo');

            if (!prompt.trim()) {
                alert('Kripya Video Prompt paste karein!');
                return;
            }

            btn.disabled = true;
            btn.innerText = 'Rendering 3D Clip... (1-2 mins)';

            try {
                const response = await fetch('/generate-video', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt })
                });

                const data = await response.json();
                if (data.success && data.video_url) {
                    videoElem.src = data.video_url;
                    container.classList.remove('hidden');
                } else {
                    alert('Video Render Error: ' + (data.error || 'API Token Required on Render'));
                }
            } catch (err) {
                alert('Video Render Failed!');
            } finally {
                btn.disabled = false;
                btn.innerText = 'Render 3D Clip 🎥';
            }
        }

        function copyOutput() {
            navigator.clipboard.writeText(document.getElementById('resultContent').innerText);
            alert('Script copied to clipboard!');
        }
    </script>
</body>
</html>
