
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUPER YODDHA - 3D Cinematic Audio Studio</title>
    <style>
        body {
            background-color: #0b0b0b;
            color: #f3f3f3;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 40px auto;
            background: #141414;
            border: 2px solid #d4af37;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.2);
        }
        h1 {
            text-align: center;
            color: #ff3333;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 2px 4px rgba(255, 51, 51, 0.4);
        }
        textarea {
            width: 100%;
            height: 120px;
            background: #1f1f1f;
            border: 1px solid #444;
            color: #fff;
            padding: 12px;
            border-radius: 6px;
            font-size: 16px;
            margin-bottom: 15px;
            resize: vertical;
        }
        textarea:focus {
            border-color: #d4af37;
            outline: none;
        }
        button {
            background: linear-gradient(135deg, #ff3333, #b30000);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
        }
        button:hover {
            background: linear-gradient(135deg, #ff4d4d, #cc0000);
            box-shadow: 0 0 10px rgba(255, 51, 51, 0.5);
        }
        .output-box {
            margin-top: 25px;
            background: #1a1a1a;
            border-left: 4px solid #d4af37;
            padding: 20px;
            border-radius: 4px;
            white-space: pre-wrap;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Super Yoddha Studio</h1>
        <p style="text-align: center; color: #d4af37;">3D Cinematic Audio Drama Script & Prompt Generator</p>
        
        <label for="prompt">Enter Audio Drama Concept:</label>
        <textarea id="prompt" placeholder="E.g., Scene 1: Yoddha enters the dark valley facing the shadow beast..."></textarea>
        
        <button onclick="generateScript()">Generate Script</button>
        
        <div id="output" class="output-box" style="display: none;"></div>
    </div>

    <script>
        async function generateScript() {
            const promptText = document.getElementById('prompt').value;
            const outputDiv = document.getElementById('output');
            
            if (!promptText) {
                alert('Please enter a prompt!');
                return;
            }

            outputDiv.style.display = 'block';
            outputDiv.innerText = 'Generating cinematic experience... Please wait...';

            try {
                const response = await fetch('/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: promptText })
                });
                
                const data = await response.json();
                if (response.ok) {
                    outputDiv.innerText = data.result;
                } else {
                    outputDiv.innerText = 'Error: ' + (data.error || 'Something went wrong');
                }
            } catch (err) {
                outputDiv.innerText = 'Network Error: ' + err.message;
            }
        }
    </script>
</body>
</html>
