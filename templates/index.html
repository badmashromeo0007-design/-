<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Cinematic Audio Drama Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #08080c; color: #f3f4f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .red-glow { border: 1px solid rgba(220, 38, 38, 0.4); box-shadow: 0 0 30px rgba(220, 38, 38, 0.15); }
    </style>
</head>
<body class="min-h-screen py-8 px-4">
    <div class="max-w-5xl mx-auto">
        <header class="text-center mb-8">
            <h1 class="text-xl md:text-3xl font-black text-red-600 tracking-wider">CINEMATIC 3D AUDIO DRAMA & STUDIO</h1>
            <p class="text-gray-400 text-xs md:text-sm mt-2">BTTH x Super Yoddha Hyper-Realistic Pipeline</p>
        </header>

        <!-- Script Control Panel -->
        <div class="red-glow bg-gray-900/90 rounded-2xl p-6 md:p-8 backdrop-blur-md mb-8">
            <div class="mb-5">
                <label class="block text-sm font-bold text-amber-400 mb-2">Episode Concept / Storyline *</label>
                <textarea id="story_summary" rows="3" class="w-full bg-black/80 border border-gray-700 rounded-xl p-3 text-white text-sm" placeholder="Example: Dhruv jungle mein akela hai..."></textarea>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-300 mb-1">Chapter No.</label>
                    <input type="number" id="chapter_number" value="2" class="w-full bg-black/80 border border-gray-700 rounded-lg p-3 text-white text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-300 mb-1">Chapter Title</label>
                    <input type="text" id="chapter_title" value="Episode 2" class="w-full bg-black/80 border border-gray-700 rounded-lg p-3 text-white text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-300 mb-1">System Name</label>
                    <input type="text" id="system_name" value="DIVINE SOUL SYSTEM" class="w-full bg-black/80 border border-gray-700 rounded-lg p-3 text-white text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-300 mb-1">Dhruv Rank</label>
                    <select id="dhruv_rank" class="w-full bg-black/80 border border-gray-700 rounded-lg p-3 text-white text-sm">
                        <option value="3rd Star (Shunya Rank)">3rd Star (Shunya Rank)</option>
                        <option value="Dou Zhe Stage">Dou Zhe Stage</option>
                    </select>
                </div>
            </div>
            <button onclick="generateScript()" id="genBtn" class="w-full bg-red-600 hover:bg-red-700 text-white font-extrabold py-3 rounded-xl text-sm">GENERATE SCRIPT & VIDEO PROMPTS 🎬✨</button>
        </div>

        <!-- Voiceover Studio -->
        <div class="red-glow bg-gray-900/90 rounded-2xl p-6 backdrop-blur-md mb-8">
            <h2 class="text-lg font-bold text-amber-400 mb-3">1. Character Voiceover Studio</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-3">
                <select id="voice_type" class="bg-black/80 border border-gray-700 rounded-lg p-3 text-white text-xs">
                    <option value="hi-IN-MadhurNeural">Dhruv (Male Hero)</option>
                    <option value="hi-IN-SwaraNeural">Lara (Heroine)</option>
                </select>
                <input type="text" id="voice_text_input" placeholder="Dialogue text yahan daalein..." class="md:col-span-2 bg-black/80 border border-gray-700 rounded-lg p-3 text-white text-xs">
            </div>
            <button onclick="generateAudio()" id="audBtn" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2.5 px-5 rounded-lg text-xs">Generate Audio MP3 🎙️</button>
            <div id="audioContainer" class="mt-3 hidden">
                <audio id="renderedAudio" controls class="w-full"></audio>
            </div>
        </div>

        <!-- Video Generator with Character Presets -->
        <div class="red-glow bg-gray-900/90 rounded-2xl p-6 backdrop-blur-md mb-8">
            <h2 class="text-lg font-bold text-amber-400 mb-3">2. Hyper-Realistic 3D Video Render Generator</h2>
            <div class="mb-3 flex flex-col md:flex-row gap-3 items-center">
                <label class="text-xs text-gray-300 font-semibold">Select Character Preset:</label>
                <select id="char_preset" onchange="loadPresetPrompt()" class="bg-black/80 border border-gray-700 rounded-lg p-2.5 text-white text-xs flex-1">
                    <option value="dhruv">Dhruv (Xiao Yan Style - Hero)</option>
                    <option value="vidur">Acharya Vidur (Yao Lao Style - Mentor)</option>
                    <option value="lara">Lara Zayan (Heroine / Warrior)</option>
                    <option value="beast">Mythical Dark Beast / Monster</option>
                </select>
            </div>
            <div class="flex flex-col gap-3">
                <textarea id="video_prompt_input" rows="3" placeholder="3D Video Prompt yahan aayega..." class="w-full bg-black/80 border border-gray-700 rounded-lg p-3 text-white text-xs"></textarea>
                <button onclick="generateVideo()" id="vidBtn" class="bg-amber-600 hover:bg-amber-700 text-white font-bold py-3 px-5 rounded-lg text-xs">Render Hyper-Realistic 3D Clip 🎥</button>
            </div>
            <div id="videoContainer" class="mt-3 hidden text-center">
                <video id="renderedVideo" controls class="w-full max-w-md mx-auto rounded-lg"></video>
            </div>
        </div>

        <!-- Auto Sync Studio -->
        <div class="red-glow bg-gray-900/90 rounded-2xl p-6 backdrop-blur-md mb-8 text-center">
            <h2 class="text-lg font-bold text-amber-400 mb-3">3. Sync Video & Audio (Perfect Match)</h2>
            <button onclick="mergeMedia()" id="mergeBtn" class="bg-green-600 hover:bg-green-700 text-white font-extrabold py-3 px-8 rounded-xl text-sm">SYNC & PREVIEW MEDIA ⚡</button>
            <div id="finalContainer" class="mt-4 hidden space-y-3">
                <p class="text-xs text-green-400">Synchronized Media Ready for Playback!</p>
                <video id="finalVideo" controls class="w-full max-w-xl mx-auto rounded-xl border border-green-500 shadow-2xl"></video>
                <audio id="finalAudioSync" controls class="w-full max-w-md mx-auto"></audio>
            </div>
        </div>

        <!-- Script Output -->
        <div id="outputSection" class="hidden red-glow bg-gray-900/90 rounded-2xl p-6 backdrop-blur-md">
            <h2 class="text-lg font-bold text-amber-400 mb-2">Generated Script & Video Prompts</h2>
            <div id="resultContent" class="whitespace-pre-wrap text-gray-200 font-mono text-xs"></div>
        </div>
    </div>

    <script>
        let currentAudioPath = "";
        let currentVideoUrl = "";

        window.onload = function() {
            loadPresetPrompt();
        };

        async function loadPresetPrompt() {
            const character = document.getElementById('char_preset').value;
            const res = await fetch('/get-preset', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({character})
            });
            const data = await res.json();
            if(data.success) {
                document.getElementById('video_prompt_input').value = data.prompt;
            }
        }

        async function generateScript() {
            const story_summary = document.getElementById('story_summary').value;
            const chapter_number = document.getElementById('chapter_number').value;
            const chapter_title = document.getElementById('chapter_title').value;
            const system_name = document.getElementById('system_name').value;
            const dhruv_rank = document.getElementById('dhruv_rank').value;

            const res = await fetch('/generate', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({story_summary, chapter_number, chapter_title, system_name, dhruv_rank})
            });
            const data = await res.json();
            if(data.success) {
                document.getElementById('resultContent').innerText = data.result;
                document.getElementById('outputSection').classList.remove('hidden');
            }
        }

        async function generateAudio() {
            const text = document.getElementById('voice_text_input').value;
            const voice_type = document.getElementById('voice_type').value;
            const res = await fetch('/generate-audio', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({text, voice_type})
            });
            const data = await res.json();
            if(data.success) {
                currentAudioPath = data.audio_url;
                const audioElem = document.getElementById('renderedAudio');
                audioElem.src = data.audio_url;
                document.getElementById('audioContainer').classList.remove('hidden');
            }
        }

        async function generateVideo() {
            const prompt = document.getElementById('video_prompt_input').value;
            const res = await fetch('/generate-video', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({prompt})
            });
            const data = await res.json();
            if(data.success) {
                currentVideoUrl = data.video_url;
                const videoElem = document.getElementById('renderedVideo');
                videoElem.src = data.video_url;
                document.getElementById('videoContainer').classList.remove('hidden');
            }
        }

        async function mergeMedia() {
            if(!currentVideoUrl || !currentAudioPath) {
                alert('Pehle video render karein aur audio generate karein!');
                return;
            }
            const btn = document.getElementById('mergeBtn');
            btn.innerText = 'Syncing Media...';
            
            const res = await fetch('/merge-media', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({video_url: currentVideoUrl, audio_path: currentAudioPath})
            });
            const data = await res.json();
            if(data.success) {
                const finalVid = document.getElementById('finalVideo');
                finalVid.src = data.final_video_url;
                
                const finalAud = document.getElementById('finalAudioSync');
                finalAud.src = data.synchronized_audio_url;

                document.getElementById('finalContainer').classList.remove('hidden');
                btn.innerText = 'SYNCHRONIZATION SUCCESSFUL ✅';
            } else {
                alert('Error: ' + data.error);
                btn.innerText = 'SYNC & PREVIEW MEDIA ⚡';
            }
        }
    </script>
</body>
</html>
