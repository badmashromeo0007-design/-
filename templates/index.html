<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUPER YODDHA STUDIO</title>
    <style>
        body {
            background-color: #0f0f0f;
            color: #f1f1f1;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: #181818;
            border: 2px solid #ffd700;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.3);
        }
        h1 {
            color: #ff3333;
            text-align: center;
            text-shadow: 0 0 5px rgba(255, 0, 0, 0.5);
        }
        h3 {
            color: #ffd700;
            text-align: center;
            font-size: 14px;
        }
        label {
            display: block;
            margin-top: 15px;
            color: #ccc;
        }
        textarea {
            width: 100%;
            height: 120px;
            background: #222;
            color: #fff;
            border: 1px solid #444;
            border-radius: 5px;
            padding: 10px;
            resize: vertical;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            background-color: #e50914;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #b20710;
        }
        #result {
            margin-top: 20px;
            background: #111;
            border: 1px solid #333;
            padding: 15px;
            border-radius: 5px;
            white-space: pre-wrap;
            line-height: 1.5;
            color: #e0e0e0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>SUPER YODDHA STUDIO</h1>
        <h3>3D Cinematic Audio Drama Script & Prompt Generator</h3>
        
        <label for="concept">Enter Audio Drama Concept:</label>
        <textarea id="concept" placeholder="Yahan apna concept likhein..."></textarea>
        
        <button onclick="generateScript()">Generate Script</button>
        
        <div id="result"></div>
    </div>

    <script>
        async function generateScript() {
            const concept = document.getElementById('concept').value;
            const resultDiv = document.getElementById('result');
            
            if (!concept.trim()) {
                alert('Kripya pehle concept darj karein!');
                return;
            }

            resultDiv.innerText = 'Generating script, kripya intezaar karein...';

            try {
                const response = await fetch('/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ concept: concept })
                });

                const data = await response.json();
                if (response.ok) {
                    resultDiv.innerText = data.script;
                } else {
                    resultDiv.innerText = 'Error: ' + (data.error || 'Kuch gadbad ho gayi.');
                }
            } catch (err) {
                resultDiv.innerText = 'Network Error: ' + err.message;
            }
        }
    </script>
</body>
</html>
