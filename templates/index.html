<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Yoddha Studio</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 8px; }
        textarea, input { width: 100%; padding: 10px; margin: 10px 0; background: #2d2d2d; border: 1px solid #444; color: #fff; border-radius: 4px; box-sizing: border-box; }
        button { background: #ff4757; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 4px; font-weight: bold; width: 100%; }
        button:hover { background: #ff6b81; }
        pre { background: #2d2d2d; padding: 15px; border-radius: 4px; white-space: pre-wrap; word-wrap: break-word; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Super Yoddha Studio</h2>
        <label>Concept / Storyline:</label>
        <textarea id="concept" rows="4" placeholder="Enter story concept..."></textarea>
        
        <label>Chapter No:</label>
        <input type="text" id="chapter_no" value="1">
        
        <label>Chapter Title:</label>
        <input type="text" id="chapter_title" value="The Awakening">
        
        <label>System Name:</label>
        <input type="text" id="system_name" value="Yoddha System">
        
        <label>Dhruv Rank:</label>
        <input type="text" id="dhruv_rank" value="Bronze">
        
        <button onclick="generateScript()">Generate Script</button>
        
        <h3>Generated Script:</h3>
        <pre id="output">Your script will appear here...</pre>
    </div>

    <script>
        async function generateScript() {
            const output = document.getElementById('output');
            output.innerText = "Generating script...";
            
            const data = {
                concept: document.getElementById('concept').value,
                chapter_no: document.getElementById('chapter_no').value,
                chapter_title: document.getElementById('chapter_title').value,
                system_name: document.getElementById('system_name').value,
                dhruv_rank: document.getElementById('dhruv_rank').value
            };

            try {
                const response = await fetch('/generate-script', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                if(result.status === 'success') {
                    output.innerText = result.script;
                } else {
                    output.innerText = "Error: " + result.message;
                }
            } catch (err) {
                output.innerText = "Failed to connect to server.";
            }
        }
    </script>
</body>
</html>
