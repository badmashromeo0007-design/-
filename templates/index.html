<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Script Generator</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #fff; padding: 20px; }
        .container { max-width: 750px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 8px; }
        label { display: block; margin-top: 10px; font-weight: bold; font-size: 16px; color: #ff4757; }
        textarea { width: 100%; padding: 12px; margin-top: 8px; background: #2d2d2d; border: 1px solid #444; color: #fff; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
        button { margin-top: 15px; width: 100%; padding: 12px; background: #ff4757; color: white; border: none; font-size: 16px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #ff6b81; }
        .result { margin-top: 20px; background: #2d2d2d; padding: 15px; border-radius: 4px; white-space: pre-wrap; font-size: 14px; line-height: 1.6; border-left: 4px solid #ff4757; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Audio & Video Script Generator</h2>
        <form method="POST">
            <label>Apni Story / Scene Details Yahan Likhein:</label>
            <textarea name="story_input" rows="10" placeholder="Yahan apni story, characters, fight scenes, aur unki powers seedhe likh dein..." required></textarea>

            <button type="submit">Generate Script</button>
        </form>

        {% if generated_script %}
            <h3>Generated Cinematic Script:</h3>
            <div class="result">{{ generated_script }}</div>
        {% endif %}
    </div>
</body>
</html>
